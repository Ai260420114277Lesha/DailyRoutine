<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>Расписание</title>
<style>
  :root {
    --bg-1: #fafaff;
    --bg-2: #f2f2fa;
    --card: #ffffff;
    --text: #16162a;
    --muted: #8a8aa3;
    --border: #ececf4;
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-soft: #eef0ff;
    --done: #10b981;
    --done-soft: #ecfdf5;
    --done-border: #a7f3d0;
    --skip: #f59e0b;
    --skip-soft: #fffbeb;
    --skip-border: #fde68a;
    --fail: #ef4444;
    --fail-soft: #fef2f2;
    --fail-border: #fecaca;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(20, 20, 60, .04), 0 1px 3px rgba(20, 20, 60, .03);
    --shadow-md: 0 6px 20px rgba(20, 20, 60, .06);
    --shadow-lg: 0 24px 64px rgba(20, 20, 60, .18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
  }
  button { font-family: inherit; }
  input, select { font-family: inherit; }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 22px 20px 120px;
  }

  /* ---------- Header ---------- */
  header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 22px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 700; letter-spacing: -0.015em;
  }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 9px;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px; font-weight: 700;
    box-shadow: 0 4px 12px rgba(99, 102, 241, .35);
  }

  .nav-tabs {
    display: inline-flex;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 3px;
    gap: 2px;
    box-shadow: var(--shadow-sm);
  }
  .nav-tabs button {
    padding: 7px 14px;
    border: none; background: transparent;
    border-radius: 8px;
    font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }
  .nav-tabs button.active {
    background: var(--primary); color: #fff;
    box-shadow: 0 4px 10px rgba(99, 102, 241, .3);
  }
  .nav-tabs button:not(.active):hover { background: #f4f4fa; color: var(--text); }

  /* ---------- Day bar ---------- */
  .day-bar {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .day-bar .nav-btn {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    font-size: 18px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
    box-shadow: var(--shadow-sm);
  }
  .day-bar .nav-btn:hover { background: var(--primary-soft); border-color: #d6d8ff; color: var(--primary-dark); }
  .day-bar .nav-btn:active { transform: scale(.95); }

  .day-bar .date-input {
    flex: 1; min-width: 0;
    height: 38px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 11px;
    padding: 0 12px;
    font-size: 14px;
    color: var(--text);
    box-shadow: var(--shadow-sm);
    transition: border-color .15s, box-shadow .15s;
  }
  .day-bar .date-input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, .15);
  }
  .day-bar .today-btn {
    height: 38px; flex-shrink: 0;
    padding: 0 14px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 11px;
    font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer;
    transition: all .15s;
    box-shadow: var(--shadow-sm);
  }
  .day-bar .today-btn:hover { color: var(--primary-dark); border-color: #d6d8ff; background: var(--primary-soft); }
  .day-bar .today-btn[hidden] { display: none; }

  /* ---------- Day heading ---------- */
  .day-heading {
    font-size: 13px; font-weight: 500;
    color: var(--muted);
    margin: 0 0 16px 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .day-heading .today-pill {
    background: var(--primary);
    color: #fff;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 6px;
    font-weight: 600;
    letter-spacing: .02em;
    text-transform: uppercase;
  }

  /* ---------- Tasks ---------- */
  .tasks { list-style: none; padding: 0; margin: 0; }
  .task {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 14px 14px 16px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    box-shadow: var(--shadow-sm);
    transition: background .18s, border-color .18s, transform .12s;
  }
  .task:hover { transform: translateY(-1px); }
  .task.done    { background: var(--done-soft); border-color: var(--done-border); }
  .task.skipped { background: var(--skip-soft); border-color: var(--skip-border); }
  .task.failed  { background: var(--fail-soft); border-color: var(--fail-border); }

  .task .title {
    flex: 1; min-width: 0;
    font-size: 14.5px; font-weight: 500;
    word-break: break-word;
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  }
  .task.done .title { color: #146c43; }
  .task.skipped .title { color: #8a5a00; }
  .task.failed .title { color: #992020; }

  .badge {
    font-size: 10.5px; font-weight: 500;
    padding: 2px 7px; border-radius: 6px;
    background: var(--primary-soft);
    color: var(--primary-dark);
    white-space: nowrap;
    letter-spacing: .01em;
  }
  .badge.reason {
    background: rgba(245, 158, 11, .15);
    color: #8a5a00;
  }

  .task .actions {
    display: flex; gap: 5px; flex-shrink: 0;
  }
  .task .actions button {
    width: 32px; height: 32px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: #fff;
    color: #9a9ab0;
    cursor: pointer;
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    transition: all .13s;
    padding: 0; line-height: 1;
  }
  .task .actions button:hover { background: #f6f6fb; }
  .task .actions button:active { transform: scale(.9); }
  .task .actions button.b-done:hover { color: var(--done); border-color: var(--done-border); }
  .task .actions button.b-skip:hover { color: var(--skip); border-color: var(--skip-border); }
  .task .actions button.b-fail:hover { color: var(--fail); border-color: var(--fail-border); }
  .task .actions button.b-done.active { background: var(--done); color: #fff; border-color: var(--done); }
  .task .actions button.b-skip.active { background: var(--skip); color: #fff; border-color: var(--skip); }
  .task .actions button.b-fail.active { background: var(--fail); color: #fff; border-color: var(--fail); }

  .task .del {
    width: 22px; height: 22px; flex-shrink: 0;
    background: none; border: none;
    color: #c9c9d6;
    font-size: 18px; line-height: 1;
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s;
  }
  .task .del:hover { color: var(--fail); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 44px 20px;
    font-size: 14px;
    background: rgba(255, 255, 255, .5);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }
  .empty .emoji {
    display: block; font-size: 26px; margin-bottom: 8px; opacity: .8;
  }

  /* ---------- Calendar ---------- */
  .calendar {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow-sm);
  }
  .calendar h2 {
    font-size: 12px; font-weight: 600;
    margin: 0 0 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-head {
    text-align: center;
    font-size: 10.5px; font-weight: 600;
    color: #b8b8cc;
    padding: 4px 0;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 8px;
    background: #f4f4fa;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(10px, 2.6vw, 13px);
    font-weight: 500;
    color: #6c6c85;
    position: relative; cursor: default;
    transition: transform .12s;
  }
  .cal-cell:hover { transform: scale(1.08); z-index: 2; }
  .cal-cell.empty { background: transparent; pointer-events: none; }
  .cal-cell.today { outline: 2px solid var(--primary); outline-offset: -2px; font-weight: 700; }

  .cal-cell.no-tasks   { background: #f4f4fa; color: #c0c0d2; }
  .cal-cell.score-0    { background: #fecaca; color: #7a2020; }
  .cal-cell.score-low  { background: #fde68a; color: #7a5a10; }
  .cal-cell.score-mid  { background: #bbf7d0; color: #14532d; }
  .cal-cell.score-full { background: var(--done); color: #fff; }

  .cal-cell .tip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%; transform: translateX(-50%);
    background: #16162a; color: #fff;
    padding: 6px 10px; border-radius: 8px;
    font-size: 11px; white-space: nowrap;
    pointer-events: none; opacity: 0;
    transition: opacity .15s; z-index: 20;
    font-weight: 400;
    box-shadow: 0 6px 16px rgba(0,0,0,.2);
  }
  .cal-cell:hover .tip { opacity: 1; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 16px;
    margin-top: 16px; font-size: 12px; color: var(--muted);
  }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .dot { width: 11px; height: 11px; border-radius: 3px; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    right: 22px;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    height: 54px;
    padding: 0 22px 0 18px;
    border-radius: 27px;
    border: none;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: #fff;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 10px 28px rgba(99, 102, 241, .45);
    transition: transform .15s, box-shadow .15s;
    z-index: 50;
  }
  .fab .plus {
    font-size: 22px; font-weight: 300; line-height: 1;
    margin-top: -2px;
  }
  .fab:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(99, 102, 241, .55); }
  .fab:active { transform: translateY(0) scale(.97); }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20, 20, 45, .35);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 100;
    animation: fadeIn .18s ease;
  }
  .overlay[hidden] { display: none; }

  .modal {
    background: #fff;
    border-radius: 22px;
    width: 100%; max-width: 440px;
    padding: 22px;
    box-shadow: var(--shadow-lg);
    animation: popIn .24s cubic-bezier(.2, .9, .3, 1);
    max-height: 90vh;
    max-height: 90dvh;
    overflow-y: auto;
  }
  .modal-handle {
    display: none;
    width: 40px; height: 4px;
    background: #e2e2ec; border-radius: 2px;
    margin: 0 auto 14px;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.95) translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: none; }
  }

  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .modal-header h2 {
    font-size: 17px; font-weight: 700;
    margin: 0; letter-spacing: -0.015em;
  }
  .modal-close {
    width: 32px; height: 32px;
    border-radius: 9px; border: none;
    background: #f4f4fa;
    color: var(--muted);
    font-size: 20px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
    padding: 0;
  }
  .modal-close:hover { background: #ebebf5; color: var(--text); }

  /* ---------- Segmented ---------- */
  .segmented {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: #f4f4fa;
    border-radius: 12px;
    padding: 4px;
    gap: 3px;
    margin-bottom: 18px;
  }
  .segmented button {
    padding: 9px 6px;
    border: none; background: transparent;
    border-radius: 9px;
    font-size: 12.5px; font-weight: 600;
    color: var(--muted); cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .segmented button.active {
    background: #fff; color: var(--primary-dark);
    box-shadow: 0 2px 6px rgba(20, 20, 60, .08);
  }

  /* ---------- Form ---------- */
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .field input[type="text"],
  .field input[type="date"] {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    color: var(--text);
    background: #fafaff;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .field input[type="text"]:focus,
  .field input[type="date"]:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, .13);
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .day-chip input { display: none; }
  .day-chip span {
    display: flex; align-items: center; justify-content: center;
    height: 42px;
    border-radius: 11px;
    background: #f4f4fa;
    color: var(--muted);
    font-size: 12.5px; font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: all .15s;
  }
  .day-chip span:hover { background: #ebebf5; }
  .day-chip input:checked + span {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(99, 102, 241, .35);
  }

  .mode-panel[hidden] { display: none; }

  .submit-btn {
    width: 100%;
    height: 50px;
    margin-top: 6px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: #fff;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: transform .12s, box-shadow .15s;
    box-shadow: 0 8px 20px rgba(99, 102, 241, .35);
  }
  .submit-btn:hover { box-shadow: 0 12px 26px rgba(99, 102, 241, .45); }
  .submit-btn:active { transform: scale(.98); }

  /* ---------- Mobile ---------- */
  @media (max-width: 620px) {
  .container { padding: 16px 14px 120px; }
  header { margin-bottom: 16px; }
  .brand span.brand-text { display: none; }
  .nav-tabs button { padding: 7px 12px; font-size: 12.5px; }

  .day-bar .today-btn { padding: 0 11px; font-size: 12.5px; }

  .task { padding: 12px 12px 12px 14px; gap: 8px; }
  .task .title { font-size: 14px; }
  .task .actions { gap: 4px; }
  .task .actions button { width: 30px; height: 30px; font-size: 13px; }

  .fab {
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: 56px; height: 56px; padding: 0;
    border-radius: 50%;
    justify-content: center;
  }
  .fab .label { display: none; }
  .fab .plus { font-size: 26px; margin: 0; }

  .overlay {
    padding: 0;
    align-items: flex-end;
  }
  .modal {
    max-width: 100%;
    border-radius: 22px 22px 0 0;
    padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    animation: slideUp .3s cubic-bezier(.2, .9, .3, 1);
    max-height: 92vh;
    max-height: 92dvh;
  }
  .modal-handle { display: block; }

  /* ---------- Календарь на мобильных ---------- */
  .calendar { padding: 14px 10px; }
  .cal-grid { gap: 3px; }

  /* Отказываемся от квадратной формы — используем фиксированную высоту */
  .cal-cell {
    aspect-ratio: auto;
    height: 34px;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 600;
  }
  .cal-cell:hover { transform: none; }  /* убираем «дрожание» на тач-устройствах */
  .cal-cell:active { transform: scale(.94); }

  /* Тултипы на тач-устройствах мешают — показываем их только по тапу */
  .cal-cell .tip {
    display: none;
  }

  .cal-head {
    font-size: 9.5px;
    padding: 3px 0;
  }

  .legend { gap: 5px 10px; font-size: 11px; margin-top: 12px; }
  .legend .dot { width: 10px; height: 10px; }
}

/* Совсем узкие экраны (iPhone SE и т.п.) */
@media (max-width: 380px) {
  .cal-cell { height: 30px; font-size: 10.5px; border-radius: 6px; }
  .cal-grid { gap: 2px; }
  .calendar { padding: 12px 8px; }
  .cal-head { font-size: 9px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <div class="brand-mark">Р</div>
      <span class="brand-text">Расписание</span>
    </div>
    <nav class="nav-tabs">
      <button data-tab="today" class="active">День</button>
      <button data-tab="productivity">Продуктивность</button>
    </nav>
  </header>

  <!-- ======== ДЕНЬ ======== -->
  <section id="tab-today">
    <div class="day-bar">
      <button class="nav-btn" id="prev-day" title="Предыдущий день">‹</button>
      <input type="date" id="selected-date" class="date-input">
      <button class="nav-btn" id="next-day" title="Следующий день">›</button>
      <button class="today-btn" id="today-btn" hidden>Сегодня</button>
    </div>

    <h2 class="day-heading" id="day-heading"></h2>
    <ul class="tasks" id="tasks-list"></ul>
  </section>

  <!-- ======== ПРОДУКТИВНОСТЬ ======== -->
  <section id="tab-productivity" hidden>
    <div class="calendar">
      <h2>Последние 60 дней</h2>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="legend">
        <div class="item"><div class="dot" style="background:#10b981"></div>всё выполнено</div>
        <div class="item"><div class="dot" style="background:#bbf7d0"></div>частично</div>
        <div class="item"><div class="dot" style="background:#fde68a"></div>мало</div>
        <div class="item"><div class="dot" style="background:#fecaca"></div>ничего</div>
        <div class="item"><div class="dot" style="background:#f4f4fa"></div>нет задач</div>
      </div>
    </div>
  </section>
</div>

<!-- ======== FAB ======== -->
<button class="fab" id="fab" title="Добавить задачу">
  <span class="plus">+</span>
  <span class="label">Добавить задачу</span>
</button>

<!-- ======== MODAL ======== -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2>Новая задача</h2>
      <button class="modal-close" id="modal-close" aria-label="Закрыть">×</button>
    </div>

    <div class="segmented" id="modal-tabs">
      <button data-mode="today" class="active">Сегодня</button>
      <button data-mode="single">На день</button>
      <button data-mode="recurring">Повтор</button>
    </div>

    <form id="add-form">
      <div class="field">
        <label for="t-title">Что нужно сделать?</label>
        <input type="text" id="t-title" placeholder="Например: зарядка" required autocomplete="off" maxlength="120">
      </div>

      <div class="field mode-panel" data-mode="single" hidden>
        <label for="t-date">Дата</label>
        <input type="date" id="t-date">
      </div>

      <div class="field mode-panel" data-mode="recurring" hidden>
        <label>Дни недели</label>
        <div class="days-grid" id="t-days">
          <label class="day-chip"><input type="checkbox" value="0"><span>Пн</span></label>
          <label class="day-chip"><input type="checkbox" value="1"><span>Вт</span></label>
          <label class="day-chip"><input type="checkbox" value="2"><span>Ср</span></label>
          <label class="day-chip"><input type="checkbox" value="3"><span>Чт</span></label>
          <label class="day-chip"><input type="checkbox" value="4"><span>Пт</span></label>
          <label class="day-chip"><input type="checkbox" value="5"><span>Сб</span></label>
          <label class="day-chip"><input type="checkbox" value="6"><span>Вс</span></label>
        </div>
      </div>

      <button type="submit" class="submit-btn">Добавить</button>
    </form>
  </div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const WEEKDAYS_SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const WEEKDAYS_FULL  = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const MONTHS_GEN     = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

/* ---------- Дата ---------- */
function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function parseISO(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function shiftISO(iso, deltaDays) {
  const d = parseISO(iso);
  d.setDate(d.getDate() + deltaDays);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function formatHeading(iso) {
  const d = parseISO(iso);
  return `${WEEKDAYS_FULL[d.getDay()]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
}

/* ---------- Табы ---------- */
$$(".nav-tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    $$(".nav-tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    $("#tab-today").hidden = tab !== "today";
    $("#tab-productivity").hidden = tab !== "productivity";
    if (tab === "productivity") loadProductivity();
  });
});

/* ---------- Day bar ---------- */
const dateInput = $("#selected-date");
dateInput.value = todayISO();

function refreshDayHeading() {
  const iso = dateInput.value;
  const heading = $("#day-heading");
  heading.innerHTML = "";
  heading.appendChild(document.createTextNode(formatHeading(iso)));
  if (iso === todayISO()) {
    const pill = document.createElement("span");
    pill.className = "today-pill";
    pill.textContent = "Сегодня";
    heading.appendChild(pill);
  }
  $("#today-btn").hidden = iso === todayISO();
}

dateInput.addEventListener("change", () => { refreshDayHeading(); loadTasks(); });
$("#prev-day").addEventListener("click", () => {
  dateInput.value = shiftISO(dateInput.value, -1);
  refreshDayHeading(); loadTasks();
});
$("#next-day").addEventListener("click", () => {
  dateInput.value = shiftISO(dateInput.value, 1);
  refreshDayHeading(); loadTasks();
});
$("#today-btn").addEventListener("click", () => {
  dateInput.value = todayISO();
  refreshDayHeading(); loadTasks();
});

/* ---------- Список задач ---------- */
async function loadTasks() {
  const d = dateInput.value;
  const res = await fetch("/api/tasks?date=" + d);
  const tasks = await res.json();
  const list = $("#tasks-list");
  list.innerHTML = "";

  if (!tasks.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.innerHTML = '<span class="emoji">🗓️</span>Задач на этот день нет.<br>Нажмите «＋» внизу, чтобы добавить.';
    list.appendChild(li);
    return;
  }

  for (const t of tasks) {
    const li = document.createElement("li");
    li.className = "task";
    const status = t.log ? t.log.status : null;
    if (status) li.classList.add(status);

    // Заголовок + бейджи
    const title = document.createElement("div");
    title.className = "title";
    const text = document.createElement("span");
    text.textContent = t.title;
    title.appendChild(text);

    if (t.type === "recurring") {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = "↻ " + t.days.map(x => WEEKDAYS_SHORT[x]).join("·");
      title.appendChild(b);
    }
    if (t.log && t.log.reason) {
      const b = document.createElement("span");
      b.className = "badge reason";
      b.textContent = t.log.reason;
      title.appendChild(b);
    }
    li.appendChild(title);

    // Кнопки статусов
    const actions = document.createElement("div");
    actions.className = "actions";

    const mkBtn = (label, cls, statusVal, tooltip) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.title = tooltip;
      b.className = cls;
      if (status === statusVal) b.classList.add("active");
      b.addEventListener("click", () => setStatus(t.id, statusVal, status));
      return b;
    };

    actions.appendChild(mkBtn("✓", "b-done", "done",    "Выполнено"));
    actions.appendChild(mkBtn("⊘", "b-skip", "skipped", "Пропущено по уважительной причине"));
    actions.appendChild(mkBtn("✗", "b-fail", "failed",  "Не выполнено"));
    li.appendChild(actions);

    // Удаление
    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "×";
    del.title = "Удалить задачу";
    del.addEventListener("click", async () => {
      if (!confirm("Удалить задачу во всех днях?")) return;
      await fetch("/api/tasks/" + t.id, { method: "DELETE" });
      loadTasks();
    });
    li.appendChild(del);

    list.appendChild(li);
  }
}

async function setStatus(taskId, status, currentStatus) {
  const date = dateInput.value;
  const newStatus = currentStatus === status ? "none" : status;

  let reason = "";
  if (newStatus === "skipped") {
    const r = prompt("Уважительная причина пропуска:", "");
    if (r === null) return;
    reason = r;
  }

  await fetch(`/api/tasks/${taskId}/log`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ date, status: newStatus, reason }),
  });
  loadTasks();
}

/* ---------- Модалка ---------- */
const overlay = $("#overlay");
let currentMode = "today";

function openModal() {
  resetModal();
  overlay.hidden = false;
  document.body.style.overflow = "hidden";
  setTimeout(() => $("#t-title").focus(), 120);
}
function closeModal() {
  overlay.hidden = true;
  document.body.style.overflow = "";
}
function resetModal() {
  // Возвращаемся на вкладку «Сегодня» и чистим поля
  currentMode = "today";
  $$("#modal-tabs button").forEach(b => b.classList.toggle("active", b.dataset.mode === "today"));
  syncModePanels();
  $("#add-form").reset();
  $("#t-date").value = todayISO();
}

function syncModePanels() {
  $$(".mode-panel").forEach(p => {
    p.hidden = p.dataset.mode !== currentMode;
  });
}

$$("#modal-tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    $$("#modal-tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMode = btn.dataset.mode;
    syncModePanels();
    setTimeout(() => $("#t-title").focus(), 50);
  });
});

$("#fab").addEventListener("click", openModal);
$("#modal-close").addEventListener("click", closeModal);
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !overlay.hidden) closeModal();
});

/* ---------- Отправка формы ---------- */
$("#add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const title = $("#t-title").value.trim();
  if (!title) return;

  const body = { title };
  if (currentMode === "today") {
    body.type = "single";
    body.date = todayISO();
  } else if (currentMode === "single") {
    body.type = "single";
    body.date = $("#t-date").value || todayISO();
  } else {
    body.type = "recurring";
    const days = $$("#t-days input:checked").map(i => parseInt(i.value, 10));
    if (!days.length) { alert("Выберите хотя бы один день недели"); return; }
    body.days = days;
  }

  const res = await fetch("/api/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    alert("Не удалось добавить: " + (err.error || res.status));
    return;
  }

  const modeUsed = currentMode;
  closeModal();

  // Если добавили «на сегодня» — переключаем вид на сегодня, чтобы сразу увидеть
  if (modeUsed === "today") {
    dateInput.value = todayISO();
  }
  refreshDayHeading();
  loadTasks();
});

/* ---------- Продуктивность ---------- */
async function loadProductivity() {
  const to = todayISO();
  const from = shiftISO(to, -59);

  const res = await fetch(`/api/productivity?from=${from}&to=${to}`);
  const days = await res.json();

  const grid = $("#cal-grid");
  grid.innerHTML = "";

  for (const h of WEEKDAYS_SHORT) {
    const el = document.createElement("div");
    el.className = "cal-head";
    el.textContent = h;
    grid.appendChild(el);
  }

  const firstWeekday = (parseISO(days[0].date).getDay() + 6) % 7; // 0 = Пн
  for (let i = 0; i < firstWeekday; i++) {
    const el = document.createElement("div");
    el.className = "cal-cell empty";
    grid.appendChild(el);
  }

  for (const day of days) {
    const cell = document.createElement("div");
    cell.className = "cal-cell";
    cell.textContent = parseInt(day.date.slice(8, 10), 10);

    if (day.date === to) cell.classList.add("today");

    let cls;
    if (day.total === 0 || day.score === null) cls = "no-tasks";
    else if (day.score === 0)     cls = "score-0";
    else if (day.score < 0.5)     cls = "score-low";
    else if (day.score < 1)       cls = "score-mid";
    else                          cls = "score-full";
    cell.classList.add(cls);

    const tip = document.createElement("div");
    tip.className = "tip";
    tip.textContent =
      `${day.date} · ✓${day.done}  ⊘${day.skipped}  ✗${day.failed}` +
      (day.pending ? `  ·  ожид. ${day.pending}` : "");
    cell.appendChild(tip);

    grid.appendChild(cell);
  }
}

/* ---------- Старт ---------- */
$("#t-date").value = todayISO();
refreshDayHeading();
loadTasks();
</script>
</body>
</html>
