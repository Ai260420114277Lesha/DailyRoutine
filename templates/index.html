<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Расписание</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #000000;
    --muted: #666666;
    --border: #000000;
    --border-light: #e5e5e5;
    --accent: #ff4500;
    --accent-hover: #e63e00;

    /* Статусы */
    --done: #ff4500;
    --skip: #999999;
    --fail: #000000;

    --radius: 6px;
    --shadow-sm: 2px 2px 0 rgba(0,0,0,1);
    --shadow-md: 4px 4px 0 rgba(0,0,0,1);
    --shadow-lg: 8px 8px 0 rgba(0,0,0,1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; min-height: 100dvh;
  }
  button, input, select { font-family: inherit; }

  .container { max-width: 720px; margin: 0 auto; padding: 22px 20px 120px; }

  /* ---------- Header ---------- */
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }

  /* Измененный логотип (идеально центрированная белая точка) */
  .brand { display: flex; align-items: center; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: var(--radius);
    background: #000;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
  }
  .brand-mark::after {
    content: '';
    display: block;
    width: 7px;
    height: 7px;
    background: #fff;
    border-radius: 50%;
  }

  .nav-tabs {
    display: inline-flex; background: #fff; border: 2px solid var(--border);
    border-radius: var(--radius); padding: 4px; gap: 4px; box-shadow: var(--shadow-sm);
    overflow-x: auto; scrollbar-width: none; max-width: 100%;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tabs button {
    padding: 7px 14px; border: none; background: transparent; border-radius: 4px;
    font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer;
    transition: all .15s; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .nav-tabs button.active { background: #000; color: #fff; }
  .nav-tabs button:not(.active):hover { background: #f0f0f0; color: var(--text); }

  /* ---------- Day bar ---------- */
  .day-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .day-bar .nav-btn {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: var(--radius);
    border: 2px solid var(--border); background: #fff; color: var(--text);
    font-size: 20px; line-height: 1; cursor: pointer; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s, box-shadow .1s;
    box-shadow: var(--shadow-sm);
  }
  .day-bar .nav-btn:hover { background: #000; color: #fff; }
  .day-bar .nav-btn:active { transform: translate(2px, 2px); box-shadow: none; }

  .day-bar .date-input {
    flex: 1; min-width: 0; height: 40px; border: 2px solid var(--border);
    background: #fff; border-radius: var(--radius); padding: 0 12px; font-size: 14px; font-weight: 600;
    color: var(--text); box-shadow: var(--shadow-sm);
    transition: border-color .15s;
  }
  .day-bar .date-input:focus { outline: none; border-color: var(--accent); box-shadow: 2px 2px 0 var(--accent); }

  .day-bar .today-btn {
    height: 40px; flex-shrink: 0; padding: 0 16px; border: 2px solid var(--border);
    background: #fff; border-radius: var(--radius); font-size: 13px; font-weight: 700; text-transform: uppercase;
    color: var(--text); cursor: pointer; box-shadow: var(--shadow-sm);
    transition: transform .1s, box-shadow .1s;
  }
  .day-bar .today-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .day-bar .today-btn[hidden] { display: none; }

  .day-heading { font-size: 14px; font-weight: 800; color: var(--text); text-transform: uppercase; margin: 0 0 18px 2px; display: flex; align-items: center; gap: 10px; }
  .day-heading .today-pill {
    background: #000; color: #fff; font-size: 10px; padding: 3px 8px;
    border-radius: 4px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  }

  /* ---------- Tasks ---------- */
  .tasks { list-style: none; padding: 0; margin: 0; }
  .task {
    display: flex; align-items: center; gap: 12px; padding: 16px;
    background: #fff; border: 2px solid var(--border-light); border-radius: var(--radius);
    margin-bottom: 12px; box-shadow: var(--shadow-sm);
    transition: border-color .15s, transform .1s, box-shadow .1s;
  }
  .task:hover { border-color: var(--border); transform: translate(-2px, -2px); box-shadow: var(--shadow-md); }

  .task.done { border-color: var(--done); }
  .task.done .title { color: var(--done); text-decoration: none; }

  .task.skipped { border: 2px dashed var(--skip); background: #fafafa; }
  .task.skipped .title { color: var(--skip); }

  .task.failed { border-color: var(--fail); background: #f5f5f5; }
  .task.failed .title { color: var(--fail); text-decoration: line-through; }

  .task .title {
    flex: 1; min-width: 0; font-size: 15px; font-weight: 600;
    word-break: break-word; display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  }

  .badge {
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
    background: #000; color: #fff; white-space: nowrap; text-transform: uppercase; letter-spacing: .02em;
  }
  .badge.reason { background: #e5e5e5; color: #000; border: 1px solid #ccc; }

  .task .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .task .actions button {
    width: 34px; height: 34px; border-radius: 4px; border: 2px solid var(--border-light);
    background: #fff; color: #000; cursor: pointer; font-size: 16px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; transition: all .1s; padding: 0; line-height: 1;
  }
  .task .actions button:hover { background: #f0f0f0; border-color: #000; }
  .task .actions button:active { transform: translateY(2px); }

  .task .actions button.active { background: #000; color: #fff; border-color: #000; }
  .task .actions button.b-done.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .task .actions button.b-skip.active { background: var(--skip); color: #fff; border-color: var(--skip); }
  .task .actions button.b-fail.active { background: var(--fail); color: #fff; border-color: var(--fail); }

  .task .del {
    width: 24px; height: 24px; flex-shrink: 0; background: none; border: none; color: var(--muted);
    font-size: 20px; line-height: 1; cursor: pointer; padding: 0; font-weight: 700;
    display: flex; align-items: center; justify-content: center; transition: color .15s;
  }
  .task .del:hover { color: var(--accent); }

  .empty {
    text-align: center; color: var(--muted); padding: 44px 20px; font-size: 14px; font-weight: 500;
    background: #fafafa; border: 2px dashed var(--border-light); border-radius: var(--radius);
  }
  .empty .emoji { display: block; font-size: 28px; margin-bottom: 10px; opacity: .8; filter: grayscale(100%); }

  /* ---------- Calendar ---------- */
  .calendar { background: #fff; border: 2px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-md); }
  .calendar h2 { font-size: 13px; font-weight: 800; margin: 0 0 16px; color: var(--text); text-transform: uppercase; letter-spacing: .05em; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-head { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); padding: 4px 0; text-transform: uppercase; letter-spacing: .04em; }
  .cal-cell {
    aspect-ratio: 1; border-radius: 4px; background: #fff; border: 1px solid var(--border-light);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(11px, 2.6vw, 14px); font-weight: 700; color: var(--text);
    position: relative; cursor: default; transition: transform .1s;
  }
  .cal-cell:hover { transform: scale(1.05); z-index: 2; border-color: #000; }
  .cal-cell.empty { background: transparent; border: none; pointer-events: none; }
  .cal-cell.today { border: 2px solid var(--accent); }

  .cal-cell.no-tasks { background: #fff; color: var(--muted); }
  .cal-cell.score-0 { background: #000; color: #fff; border-color: #000; }
  .cal-cell.score-low { background: #cccccc; color: #000; border-color: #ccc; }
  .cal-cell.score-mid { background: #666666; color: #fff; border-color: #666; }
  .cal-cell.score-full { background: var(--accent); color: #fff; border-color: var(--accent); }

  .cal-cell .tip {
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: #000; color: #fff; padding: 6px 10px; border-radius: 4px;
    font-size: 11px; font-weight: 500; white-space: nowrap; pointer-events: none; opacity: 0;
    transition: opacity .15s; z-index: 20; border: 1px solid #fff; box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }
  .cal-cell:hover .tip { opacity: 1; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 18px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .legend .item { display: flex; align-items: center; gap: 8px; }
  .legend .dot { width: 12px; height: 12px; border-radius: 2px; border: 1px solid #000; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; right: 22px; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    height: 56px; padding: 0 24px 0 20px; border-radius: var(--radius); border: 2px solid var(--border);
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    box-shadow: var(--shadow-md);
    transition: transform .1s, box-shadow .1s; z-index: 50;
  }
  .fab .plus { font-size: 24px; font-weight: 800; line-height: 1; margin-top: -2px; }
  .fab:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-lg); }
  .fab:active { transform: translate(0, 0); box-shadow: var(--shadow-sm); }

  /* ---------- Overlay / Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    z-index: 100; animation: fadeIn .15s ease;
  }
  .overlay[hidden] { display: none; }

  .modal {
    background: #fff; border-radius: var(--radius); width: 100%; max-width: 440px; padding: 24px;
    border: 2px solid var(--border); box-shadow: var(--shadow-lg);
    animation: popIn .2s cubic-bezier(.2,.9,.3,1);
    max-height: 90vh; max-height: 90dvh; overflow-y: auto;
  }
  .modal-handle { display: none; width: 40px; height: 4px; background: #000; border-radius: 2px; margin: 0 auto 16px; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.95) translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }

  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h2 { font-size: 18px; font-weight: 800; margin: 0; text-transform: uppercase; letter-spacing: -0.02em; }
  .modal-close {
    width: 32px; height: 32px; border-radius: 4px; border: 2px solid var(--border);
    background: #fff; color: #000; font-size: 22px; font-weight: 700; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
    transition: all .1s;
  }
  .modal-close:hover { background: #000; color: #fff; }

  /* ---------- Segmented ---------- */
  .segmented {
    display: grid; grid-template-columns: repeat(3, 1fr); background: #fff;
    border: 2px solid var(--border); border-radius: var(--radius); padding: 4px; gap: 4px; margin-bottom: 20px;
  }
  .segmented button {
    padding: 10px 6px; border: none; background: transparent; border-radius: 4px;
    font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer;
    transition: all .15s; white-space: nowrap; text-transform: uppercase;
  }
  .segmented button.active { background: #000; color: #fff; }

  /* ---------- Form ---------- */
  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 12px; font-weight: 800; color: var(--text);
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em;
  }
  .field input[type="text"],
  .field input[type="date"],
  .field input[type="number"],
  .field select {
    width: 100%; height: 48px; padding: 0 14px; border: 2px solid var(--border-light);
    border-radius: var(--radius); font-size: 15px; font-weight: 600; color: var(--text); background: #fff;
    transition: border-color .15s, box-shadow .15s; box-shadow: var(--shadow-sm);
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: var(--accent); box-shadow: 2px 2px 0 var(--accent);
  }
  .field select { cursor: pointer; }

  .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-chip input { display: none; }
  .day-chip span {
    display: flex; align-items: center; justify-content: center; height: 44px;
    border-radius: 4px; background: #fff; border: 2px solid var(--border-light); color: var(--text);
    font-size: 13px; font-weight: 800; cursor: pointer; user-select: none;
    transition: all .15s; box-shadow: var(--shadow-sm);
  }
  .day-chip span:hover { border-color: #000; }
  .day-chip input:checked + span { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 2px 2px 0 #000; }

  .mode-panel[hidden] { display: none; }

  .submit-btn {
    width: 100%; height: 52px; margin-top: 8px; border: 2px solid var(--border);
    border-radius: var(--radius); background: #000; color: #fff;
    font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em;
    cursor: pointer; transition: transform .1s, box-shadow .1s; box-shadow: var(--shadow-sm);
  }
  .submit-btn:hover { background: var(--accent); border-color: var(--accent); transform: translate(-2px, -2px); box-shadow: var(--shadow-md); }
  .submit-btn:active { transform: translate(0, 0); box-shadow: none; }

  .clear-btn {
    width: 100%; margin-top: 12px; padding: 12px; border: 2px solid var(--border-light);
    border-radius: var(--radius); background: #fff; color: var(--fail);
    font-size: 13px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: all .15s;
  }
  .clear-btn:hover { background: #000; color: #fff; border-color: #000; }

  /* ---------- ЕГЭ ---------- */
  .subject-tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); background: #fff;
    border: 2px solid var(--border); border-radius: var(--radius); padding: 4px; gap: 4px;
    margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }
  .subject-tabs button {
    padding: 12px 6px; border: none; background: transparent; border-radius: 4px;
    font-size: 13px; font-weight: 800; text-transform: uppercase; color: var(--muted); cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  .subject-tabs button.active { background: #000; color: #fff; }
  .subject-tabs button:not(.active):hover { background: #f0f0f0; color: var(--text); }

  .ege-section {
    background: #fff; border: 2px solid var(--border); border-radius: var(--radius);
    padding: 18px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }
  .ege-section-title {
    font-size: 13px; font-weight: 800; color: var(--text);
    text-transform: uppercase; letter-spacing: .04em; margin: 0 0 16px;
  }
  .ege-tasks { display: flex; flex-wrap: wrap; gap: 8px; }

  .ege-task {
    width: 44px; height: 44px; border-radius: 4px; border: 2px solid var(--border-light);
    background: #fff; color: var(--text); font-size: 15px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    padding: 0; transition: transform .1s, box-shadow .1s, background .15s; box-shadow: var(--shadow-sm);
  }
  .ege-task:hover { border-color: #000; transform: translate(-2px, -2px); box-shadow: var(--shadow-md); }
  .ege-task:active { transform: translate(0, 0); box-shadow: none; }

  .ege-hint { font-size: 13px; font-weight: 500; color: var(--muted); margin: 16px 0 0; line-height: 1.4; }

  .ege-timeline-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; gap: 12px;
  }
  .ege-timeline-header .ege-section-title { margin: 0; }

  .add-action-btn {
    padding: 10px 16px; border: 2px solid var(--border); border-radius: 4px; background: #fff;
    color: var(--text); font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer;
    transition: all .1s; white-space: nowrap; box-shadow: var(--shadow-sm);
  }
  .add-action-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; transform: translate(-2px, -2px); box-shadow: var(--shadow-md); }
  .add-action-btn:active { transform: translate(0, 0); box-shadow: none; }

  /* Timeline */
  .timeline { position: relative; padding-top: 10px; }
  .timeline::before {
    content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
    width: 2px; background: var(--border); transform: translateX(-50%); z-index: 0;
  }
  .timeline .empty { position: relative; z-index: 1; border-style: dashed; }

  .tl-item {
    position: relative; z-index: 1; background: #fff; border: 2px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 24px;
    box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 6px;
  }
  .tl-item:last-child { margin-bottom: 0; }
  .tl-item::before {
    content: ''; position: absolute; left: 50%; top: -21px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--dot-color, var(--accent)); border: 2px solid #fff;
    transform: translateX(-50%); box-shadow: 0 0 0 2px var(--border); z-index: 2;
  }

  .tl-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-right: 24px; }
  .tl-badge { padding: 3px 8px; border-radius: 4px; color: #fff; font-size: 12px; font-weight: 800; white-space: nowrap; border: 1px solid #000; }
  .tl-icon { font-size: 16px; filter: grayscale(100%); }
  .tl-title { font-size: 15px; font-weight: 700; word-break: break-word; }
  .tl-meta { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; }

  .tl-del {
    position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border: none;
    background: none; color: var(--muted); font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer;
    padding: 0; display: flex; align-items: center; justify-content: center;
    border-radius: 2px; transition: all .15s;
  }
  .tl-del:hover { color: var(--accent); background: #f0f0f0; }

  /* ---------- Mobile ---------- */
  @media (max-width: 620px) {
    .container { padding: 16px 14px 120px; }
    header { margin-bottom: 16px; }
    .nav-tabs button { padding: 8px 10px; font-size: 12px; }

    .day-bar .today-btn { padding: 0 12px; font-size: 12px; }
    .task { padding: 12px; gap: 8px; }
    .task .title { font-size: 14px; }
    .task .actions { gap: 4px; }
    .task .actions button { width: 32px; height: 32px; font-size: 14px; }

    .fab {
      right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      width: 60px; height: 60px; padding: 0; border-radius: 50%; justify-content: center;
    }
    .fab .label { display: none; }
    .fab .plus { font-size: 28px; margin: 0; }

    .overlay { padding: 0; align-items: flex-end; }
    .modal {
      max-width: 100%; border-radius: 12px 12px 0 0; border-bottom: none;
      padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 0px));
      animation: slideUp .25s cubic-bezier(.2,.9,.3,1);
      max-height: 92vh; max-height: 92dvh; box-shadow: 0 -4px 0 rgba(0,0,0,1);
    }
    .modal-handle { display: block; }

    .calendar { padding: 14px 10px; }
    .cal-grid { gap: 3px; }
    .cal-cell { aspect-ratio: auto; height: 36px; border-radius: 4px; font-size: 12px; }
    .cal-cell:hover { transform: none; border-color: var(--border-light); }
    .cal-cell:active { transform: scale(.95); }
    .cal-cell .tip { display: none; }
    .cal-head { font-size: 10px; padding: 3px 0; }
    .legend { gap: 6px 12px; font-size: 11px; margin-top: 14px; }
    .legend .dot { width: 12px; height: 12px; }

    .ege-task { width: 40px; height: 40px; font-size: 14px; border-radius: 4px; }
    .ege-tasks { gap: 8px; }
    .ege-section { padding: 14px; }
    .tl-item { padding: 12px; }
    .tl-head { padding-right: 22px; }
  }

  @media (max-width: 380px) {
    .cal-cell { height: 32px; font-size: 11px; }
    .cal-grid { gap: 2px; }
    .calendar { padding: 12px 8px; }
    .cal-head { font-size: 9px; }
    .ege-task { width: 36px; height: 36px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <!-- Логотип: черный квадрат с точкой через CSS -->
      <div class="brand-mark"></div>
    </div>
    <nav class="nav-tabs">
      <button data-tab="today" class="active">День</button>
      <button data-tab="productivity">Прогресс</button>
      <button data-tab="ege">ЕГЭ</button>
    </nav>
  </header>

  <!-- ======== ДЕНЬ ======== -->
  <section id="tab-today">
    <div class="day-bar">
      <button class="nav-btn" id="prev-day" title="Предыдущий день">‹</button>

<script>
/* =========================================================
   Слой хранения (localStorage)
   ========================================================= */
const STORE_KEY = "productivity_v2";

const EGE_SUBJECTS = {
  math: { name: "Математика",    taskCount: 19 },
  rus:  { name: "Русский язык",  taskCount: 27 },
  inf:  { name: "Информатика",   taskCount: 27 },
};

const WEEKDAYS_SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const WEEKDAYS_FULL  = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const MONTHS_GEN     = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.warn("Не удалось прочитать localStorage", e); }
  return { tasks: [], logs: [], ege: {} };
}
function saveStore() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

let store = loadStore();

function ensureEgeStore() {
  if (!store.ege) store.ege = {};
  for (const key of Object.keys(EGE_SUBJECTS)) {
    if (!store.ege[key]) store.ege[key] = { tasks: {}, history: [] };
    if (!store.ege[key].tasks)   store.ege[key].tasks = {};
    if (!store.ege[key].history) store.ege[key].history = [];
  }
}
ensureEgeStore();

/* =========================================================
   Утилиты дат
   ========================================================= */
function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function dateToISO(d) {
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function parseISO(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function shiftISO(iso, deltaDays) {
  const d = parseISO(iso);
  d.setDate(d.getDate() + deltaDays);
  return dateToISO(d);
}
function formatHeading(iso) {
  const d = parseISO(iso);
  return `${WEEKDAYS_FULL[d.getDay()]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
}
function formatDateTime(ts) {
  const d = new Date(ts);
  return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}, ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

/* =========================================================
   Задачи / логи (локально)
   ========================================================= */
function getTasksForDate(iso) {
  const d = parseISO(iso);
  const weekday = (d.getDay() + 6) % 7;
  return store.tasks.filter(t => {
    if (t.type === "single") return t.date === iso;
    if (t.type === "recurring") return (t.days || []).includes(weekday);
    return false;
  });
}
function getLogForTask(taskId, iso) {
  return store.logs.find(l => l.taskId === taskId && l.date === iso) || null;
}
function createTaskApi(data) {
  const task = {
    id: uid(),
    title: data.title,
    type: data.type,
    date: data.date || null,
    days: data.days || [],
    createdAt: Date.now(),
  };
  store.tasks.push(task);
  saveStore();
  return task;
}
function deleteTaskApi(id) {
  store.tasks = store.tasks.filter(t => t.id !== id);
  store.logs  = store.logs.filter(l => l.taskId !== id);
  saveStore();
}
function setLogApi(taskId, iso, status, reason) {
  store.logs = store.logs.filter(l => !(l.taskId === taskId && l.date === iso));
  if (status !== "none") {
    store.logs.push({ id: uid(), taskId, date: iso, status, reason: reason || "" });
  }
  saveStore();
}

/* =========================================================
   Вкладки
   ========================================================= */
$$(".nav-tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    $$(".nav-tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    $("#tab-today").hidden        = tab !== "today";
    $("#tab-productivity").hidden = tab !== "productivity";
    $("#tab-ege").hidden          = tab !== "ege";
    if (tab === "productivity") loadProductivity();
    if (tab === "ege") renderEge();
  });
});

/* =========================================================
   День
   ========================================================= */
const dateInput = $("#selected-date");
dateInput.value = todayISO();

function refreshDayHeading() {
  const iso = dateInput.value;
  const heading = $("#day-heading");
  heading.innerHTML = "";
  heading.appendChild(document.createTextNode(formatHeading(iso)));
  if (iso === todayISO()) {
    const pill = document.createElement("span");
    pill.className = "today-pill";
    pill.textContent = "Сегодня";
    heading.appendChild(pill);
  }
  $("#today-btn").hidden = iso === todayISO();
}

dateInput.addEventListener("change", () => { refreshDayHeading(); loadTasks(); });
$("#prev-day").addEventListener("click", () => { dateInput.value = shiftISO(dateInput.value, -1); refreshDayHeading(); loadTasks(); });
$("#next-day").addEventListener("click", () => { dateInput.value = shiftISO(dateInput.value, 1); refreshDayHeading(); loadTasks(); });
$("#today-btn").addEventListener("click", () => { dateInput.value = todayISO(); refreshDayHeading(); loadTasks(); });

function loadTasks() {
  const iso = dateInput.value;
  const tasks = getTasksForDate(iso);
  const list = $("#tasks-list");
  list.innerHTML = "";

  if (!tasks.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.innerHTML = '<span class="emoji">🗓️</span>Задач на этот день нет.<br>Нажмите «＋» внизу, чтобы добавить.';
    list.appendChild(li);
    return;
  }

  for (const t of tasks) {
    const li = document.createElement("li");
    li.className = "task";
    const log = getLogForTask(t.id, iso);
    const status = log ? log.status : null;
    if (status) li.classList.add(status);

    const title = document.createElement("div");
    title.className = "title";
    const text = document.createElement("span");
    text.textContent = t.title;
    title.appendChild(text);

    if (t.type === "recurring") {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = "↻ " + t.days.map(x => WEEKDAYS_SHORT[x]).join("·");
      title.appendChild(b);
    }
    if (log && log.reason) {
      const b = document.createElement("span");
      b.className = "badge reason";
      b.textContent = log.reason;
      title.appendChild(b);
    }
    li.appendChild(title);

    const actions = document.createElement("div");
    actions.className = "actions";
    const mkBtn = (label, cls, statusVal, tooltip) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.title = tooltip;
      b.className = cls;
      if (status === statusVal) b.classList.add("active");
      b.addEventListener("click", () => setStatus(t.id, statusVal, status));
      return b;
    };
    actions.appendChild(mkBtn("✓", "b-done", "done",    "Выполнено"));
    actions.appendChild(mkBtn("⊘", "b-skip", "skipped", "Пропущено"));
    actions.appendChild(mkBtn("✗", "b-fail", "failed",  "Не выполнено"));
    li.appendChild(actions);

    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "×";
    del.title = "Удалить задачу";
    del.addEventListener("click", () => {
      if (!confirm("Удалить задачу во всех днях?")) return;
      deleteTaskApi(t.id);
      loadTasks();
      if (!$("#tab-productivity").hidden) loadProductivity();
    });
    li.appendChild(del);

    list.appendChild(li);
  }
}

function setStatus(taskId, status, currentStatus) {
  const iso = dateInput.value;
  const newStatus = currentStatus === status ? "none" : status;
  let reason = "";
  if (newStatus === "skipped") {
    const r = prompt("Причина пропуска:", "");
    if (r === null) return;
    reason = r;
  }
  setLogApi(taskId, iso, newStatus, reason);
  loadTasks();
}

/* =========================================================
   Модалка «Добавить задачу»
   ========================================================= */
const overlay = $("#overlay");
let currentMode = "today";

function openModal() {
  resetModal();
  overlay.hidden = false;
  document.body.style.overflow = "hidden";
  setTimeout(() => $("#t-title").focus(), 120);
}
function closeModal() { overlay.hidden = true; document.body.style.overflow = ""; }
function resetModal() {
  currentMode = "today";
  $$("#modal-tabs button").forEach(b => b.classList.toggle("active", b.dataset.mode === "today"));
  syncModePanels();
  $("#add-form").reset();
  $("#t-date").value = todayISO();
}
function syncModePanels() {
  $$(".mode-panel").forEach(p => { p.hidden = p.dataset.mode !== currentMode; });
}
$$("#modal-tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    $$("#modal-tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMode = btn.dataset.mode;
    syncModePanels();
    setTimeout(() => $("#t-title").focus(), 50);
  });
});
$("#fab").addEventListener("click", openModal);
$("#modal-close").addEventListener("click", closeModal);
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });

$("#add-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const title = $("#t-title").value.trim();
  if (!title) return;

  if (currentMode === "today") {
    createTaskApi({ title, type: "single", date: todayISO() });
    dateInput.value = todayISO();
  } else if (currentMode === "single") {
    createTaskApi({ title, type: "single", date: $("#t-date").value || todayISO() });
  } else {
    const days = $$("#t-days input:checked").map(i => parseInt(i.value, 10));
    if (!days.length) { alert("Выберите хотя бы один день недели"); return; }
    createTaskApi({ title, type: "recurring", days });
  }
  closeModal();
  refreshDayHeading();
  loadTasks();
});

/* =========================================================
   Продуктивность
   ========================================================= */
function loadProductivity() {
  const to = todayISO();
  const from = shiftISO(to, -59);

  const days = [];
  let d = parseISO(from);
  const end = parseISO(to);
  while (d <= end) {
    const iso = dateToISO(d);
    const tasks = getTasksForDate(iso);
    let done = 0, skipped = 0, failed = 0, pending = 0;
    for (const t of tasks) {
      const log = getLogForTask(t.id, iso);
      if (!log) pending++;
      else if (log.status === "done") done++;
      else if (log.status === "skipped") skipped++;
      else if (log.status === "failed") failed++;
    }
    const denom = done + failed;
    const score = denom > 0 ? done / denom : null;
    days.push({ date: iso, total: tasks.length, done, skipped, failed, pending, score });
    d.setDate(d.getDate() + 1);
  }

  const grid = $("#cal-grid");
  grid.innerHTML = "";

  for (const h of WEEKDAYS_SHORT) {
    const el = document.createElement("div");
    el.className = "cal-head";
    el.textContent = h;
    grid.appendChild(el);
  }

  const firstWeekday = (parseISO(days[0].date).getDay() + 6) % 7;
  for (let i = 0; i < firstWeekday; i++) {
    const el = document.createElement("div");
    el.className = "cal-cell empty";
    grid.appendChild(el);
  }

  for (const day of days) {
    const cell = document.createElement("div");
    cell.className = "cal-cell";
    cell.textContent = parseInt(day.date.slice(8, 10), 10);
    if (day.date === to) cell.classList.add("today");

    let cls;
    if (day.total === 0 || day.score === null) cls = "no-tasks";
    else if (day.score === 0)     cls = "score-0";
    else if (day.score < 0.5)     cls = "score-low";
    else if (day.score < 1)       cls = "score-mid";
    else                          cls = "score-full";
    cell.classList.add(cls);

    const tip = document.createElement("div");
    tip.className = "tip";
    tip.textContent = `${day.date} · ✓${day.done}  ⊘${day.skipped}  ✗${day.failed}` + (day.pending ? `  ·  ожид. ${day.pending}` : "");
    cell.appendChild(tip);
    grid.appendChild(cell);
  }
}

/* =========================================================
   ЕГЭ — состояние и рендер
   ========================================================= */
let currentSubject = "math";
let testModalState = { subject: null, taskNum: null };

function scoreColor(correct, total) {
  const ratio = total > 0 ? Math.max(0, Math.min(1, correct / total)) : 0;
  const r = Math.round(ratio * 255);
  const g = Math.round(ratio * 69);
  const b = 0;
  return `rgb(${r}, ${g}, ${b})`;
}

$$("#ege-subjects button").forEach(btn => {
  btn.addEventListener("click", () => {
    $$("#ege-subjects button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentSubject = btn.dataset.subject;
    renderEge();
  });
});

function renderEge() {
  const cfg = EGE_SUBJECTS[currentSubject];
  const subjectData = store.ege[currentSubject];
  $("#ege-heading").textContent = `Номера заданий · ${cfg.name} (${cfg.taskCount})`;

  const grid = $("#ege-tasks");
  grid.innerHTML = "";
  for (let i = 1; i <= cfg.taskCount; i++) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "ege-task";
    btn.textContent = i;

    const td = subjectData.tasks[String(i)];
    const test = td && td.test;
    if (test) {
      btn.style.background = scoreColor(test.correct, test.total);
      btn.style.color = "#fff";
      btn.style.borderColor = "#000";
      btn.title = `Задание ${i}: ${test.correct}/${test.total}`;
    } else {
      btn.title = `Задание ${i}: нет результата`;
    }
    btn.addEventListener("click", () => openTestModal(i));
    grid.appendChild(btn);
  }

  renderTimeline();
}

function renderTimeline() {
  const subjectData = store.ege[currentSubject];
  const history = (subjectData.history || []).slice().sort((a, b) => b.createdAt - a.createdAt);
  const container = $("#ege-timeline");
  container.innerHTML = "";

  if (!history.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = '<span class="emoji">📚</span>Пока нет записей.<br>Нажмите «+ Действие» или номер задания.';
    container.appendChild(empty);
    return;
  }

  for (const item of history) {
    const el = document.createElement("div");
    el.className = "tl-item";

    if (item.type === "test") {
      const color = scoreColor(item.correct, item.total);
      el.style.setProperty("--dot-color", color);

      const head = document.createElement("div");
      head.className = "tl-head";
      const badge = document.createElement("span");
      badge.className = "tl-badge";
      badge.style.background = color;
      badge.textContent = `${item.correct}/${item.total}`;
      head.appendChild(badge);
      const title = document.createElement("span");
      title.className = "tl-title";
      title.textContent = `Тест · Задание ${item.taskNum}`;
      head.appendChild(title);
      el.appendChild(head);
    } else {
      const head = document.createElement("div");
      head.className = "tl-head";
      const icon = document.createElement("span");
      icon.className = "tl-icon";
      icon.textContent = "🔧";
      head.appendChild(icon);
      const title = document.createElement("span");
      title.className = "tl-title";
      title.textContent = item.text;
      head.appendChild(title);
      el.appendChild(head);
    }

    const meta = document.createElement("div");
    meta.className = "tl-meta";
    const parts = [];
    if (item.type === "action" && item.minutes) parts.push(`${item.minutes} мин`);
    if (item.type === "action" && item.taskNum) parts.push(`Задание ${item.taskNum}`);
    parts.push(formatDateTime(item.createdAt));
    meta.textContent = parts.join(" · ");
    el.appendChild(meta);

    const del = document.createElement("button");
    del.type = "button";
    del.className = "tl-del";
    del.textContent = "×";
    del.title = "Удалить запись";
    del.addEventListener("click", () => {
      if (!confirm("Удалить запись из истории?")) return;
      const arr = store.ege[currentSubject].history;
      const idx = arr.findIndex(h => h.id === item.id);
      if (idx >= 0) { arr.splice(idx, 1); saveStore(); renderEge(); }
    });
    el.appendChild(del);

    container.appendChild(el);
  }
}

/* =========================================================
   Модалка «Результат теста»
   ========================================================= */
function openTestModal(taskNum) {
  testModalState = { subject: currentSubject, taskNum };
  const td = store.ege[currentSubject].tasks[String(taskNum)];
  const test = td && td.test;

  $("#test-modal-title").textContent = `Задание ${taskNum} · ${EGE_SUBJECTS[currentSubject].name}`;
  $("#test-total").value  = test ? test.total   : 20;
  $("#test-correct").value = test ? test.correct : 0;
  $("#test-correct").max   = test ? test.total   : 20;
  $("#test-clear").hidden  = !test;

  $("#test-overlay").hidden = false;
  document.body.style.overflow = "hidden";
  setTimeout(() => $("#test-correct").focus(), 120);
}
function closeTestModal() { $("#test-overlay").hidden = true; document.body.style.overflow = ""; }

$("#test-total").addEventListener("input", () => {
  const total = parseInt($("#test-total").value) || 1;
  $("#test-correct").max = total;
  if (parseInt($("#test-correct").value) > total) $("#test-correct").value = total;
});
$("#test-modal-close").addEventListener("click", closeTestModal);
$("#test-overlay").addEventListener("click", (e) => { if (e.target === $("#test-overlay")) closeTestModal(); });

$("#test-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const total = parseInt($("#test-total").value, 10);
  const correct = parseInt($("#test-correct").value, 10);
  if (!(total > 0) || !(correct >= 0) || correct > total) return;

  const subj = testModalState.subject;
  const taskNum = testModalState.taskNum;
  const key = String(taskNum);

  const prev = store.ege[subj].tasks[key] || {};
  store.ege[subj].tasks[key] = { ...prev, test: { correct, total, updatedAt: Date.now() } };
  store.ege[subj].history.push({
    id: uid(), type: "test", taskNum, correct, total, createdAt: Date.now(),
  });
  saveStore();
  closeTestModal();
  renderEge();
});

$("#test-clear").addEventListener("click", () => {
  if (!confirm("Удалить результат теста для этого задания?")) return;
  const { subject, taskNum } = testModalState;
  const key = String(taskNum);
  const td = store.ege[subject].tasks[key];
  if (td) {
    delete td.test;
    if (Object.keys(td).length === 0) delete store.ege[subject].tasks[key];
  }
  saveStore();
  closeTestModal();
  renderEge();
});

/* =========================================================
   Модалка «Новое действие»
   ========================================================= */
function openActionModal() {
  const cfg = EGE_SUBJECTS[currentSubject];
  const sel = $("#action-task");
  sel.innerHTML = '<option value="">— не указано —</option>';
  for (let i = 1; i <= cfg.taskCount; i++) {
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = `Задание ${i}`;
    sel.appendChild(opt);
  }
  $("#action-text").value = "";
  $("#action-minutes").value = 30;
  $("#action-overlay").hidden = false;
  document.body.style.overflow = "hidden";
  setTimeout(() => $("#action-text").focus(), 120);
}
function closeActionModal() { $("#action-overlay").hidden = true; document.body.style.overflow = ""; }

$("#add-ege-action").addEventListener("click", openActionModal);
$("#action-modal-close").addEventListener("click", closeActionModal);
$("#action-overlay").addEventListener("click", (e) => { if (e.target === $("#action-overlay")) closeActionModal(); });

$("#action-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("#action-text").value.trim();
  if (!text) return;
  const minutes = parseInt($("#action-minutes").value, 10) || 0;
  const taskNumRaw = $("#action-task").value;
  const taskNum = taskNumRaw ? parseInt(taskNumRaw, 10) : null;

  store.ege[currentSubject].history.push({
    id: uid(), type: "action", taskNum, text, minutes, createdAt: Date.now(),
  });
  saveStore();
  closeActionModal();
  renderEge();
});

/* =========================================================
   Глобальные горячие клавиши
   ========================================================= */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!overlay.hidden) closeModal();
  if (!$("#test-overlay").hidden) closeTestModal();
  if (!$("#action-overlay").hidden) closeActionModal();
});

/* =========================================================
   Старт
   ========================================================= */
$("#t-date").value = todayISO();
refreshDayHeading();
loadTasks();
</script>
</body>
</html>
